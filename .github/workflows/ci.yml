name: Tests and package

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install '.[dev]'
      - name: Numeric and integration tests
        run: python -m pytest -q
      - name: Offline export
        run: |
          for style in spotlight links raw; do
            vggt-attention --demo --style "$style" --output "outputs/demo-$style.png"
          done
      - name: Build distributions
        run: python -m build
      - name: Verify tests from the source archive
        run: |
          mkdir -p "$RUNNER_TEMP/vggt-sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/vggt-sdist"
          cd "$RUNNER_TEMP"/vggt-sdist/*
          python -m pytest -q
      - name: Verify installed wheel outside the checkout
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          for style in spotlight links raw; do
            vggt-attention --demo --style "$style" --output "$GITHUB_WORKSPACE/outputs/installed-$style.png"
          done
          vggt-attention-gui --help
      - uses: actions/upload-artifact@v4
        with:
          name: demo-python-${{ matrix.python }}
          path: outputs/
