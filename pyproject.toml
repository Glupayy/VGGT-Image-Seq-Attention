[build-system]
requires = ["setuptools>=77,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vggt-attention"
version = "0.1.0"
description = "Interactive outgoing and incoming patch attention for VGGT"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE.txt"]
dependencies = [
    "torch>=2.3", "torchvision>=0.18", "numpy>=1.24,<2", "Pillow>=9.1",
    "matplotlib>=3.7", "huggingface_hub>=0.24,<2", "einops>=0.7", "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]
notebook = ["jupyterlab>=4"]
demo = [
    "gradio==5.17.1", "viser==0.2.23", "tqdm", "hydra-core", "omegaconf",
    "opencv-python", "scipy", "onnxruntime", "requests", "trimesh",
]
research = ["seaborn", "pandas"]

[project.scripts]
vggt-attention = "vggt.attention_cli:main"
vggt-attention-gui = "interactive_attention_tkinter:main"

[project.urls]
Repository = "https://github.com/Glupayy/vggt_attn"
Issues = "https://github.com/Glupayy/vggt_attn/issues"
Upstream = "https://github.com/facebookresearch/vggt"

[tool.setuptools]
py-modules = ["attention_cache", "interactive_attention_tkinter"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vggt*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
